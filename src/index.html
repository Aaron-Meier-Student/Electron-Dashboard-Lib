<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title></title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-straight/css/uicons-solid-straight.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn-uicons.flaticon.com/2.6.0/uicons-bold-rounded/css/uicons-bold-rounded.css"
        />

        <link rel="stylesheet" href="./styles/base.css" />
        <script src="./scripts/system.js" defer></script>
    </head>
    <body>
        <header id="titleBar">
            <i class="icon"></i>
            <h1 class="title">Untitled Dashboard</h1>
            <h2 class="version">
                <i class="fi fi-ss-bullet"></i
                ><i class="fi fi-ss-bullet pulse"></i>Version
            </h2>
            <div class="windowActions">
                <button class="mini"><i class="fi fi-br-minus"></i></button>
                <button class="full"><i class="fi fi-br-expand"></i></button>
                <button class="close"><i class="fi fi-br-x"></i></button>
            </div>
        </header>
        <nav>
            <button class="shrink">
                <i class="fi fi-br-angle-small-left"></i>
            </button>
        </nav>
        <main></main>
        <div id="notificationHolder"></div>
        <div id="promptHolder" class="fadeOut hidden">
            <div id="promptDisplay"></div>
        </div>
    </body>
</html>
